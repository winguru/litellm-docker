# config.yaml file for LiteLLM
environment_variables: {
  "PG_VECTOR_API_BASE": os.environ/PGVECTOR_BASE_URL,
  "PG_VECTOR_API_KEY": os.environ/PGVECTOR_SERVER_API_KEY
}

litellm_settings:
  callbacks: ["langfuse_otel", "custom_hooks.litellm_vision_proxy.hook"]
  check_provider_endpoint: true
  request_timeout: 600
  langfuse_default_tags:
    - cache_hit
    - cache_key
    - proxy_base_url
    - user_api_key_alias
    - user_api_key_user_id
    - user_api_key_user_email
    - user_api_key_team_alias
    - semantic-similarity
    - proxy_base_url
    - app
    - user_id
    - session_id
    - conversation_id
    - route
    - provider
    - model_name
  public_model_groups_links: {}
  cache: true
  enable_redis_auth_cache: true # Crucial for syncing virtual API keys
  cache_params:
    type: "redis"
    host: "redis-server"
    port: 6379
    password: os.environ/REDIS_PASSWORD

router_settings:
  routing_strategy: simple-shuffle
  redis_host: "redis-server"
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  # General storage configurations 
  vector_store_type: "pg_vector"
  vector_store_api_base: os.environ/PGVECTOR_BASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
    - header_name: X-Session-Id
      litellm_user_role: internal_user
    - header_name: X-Conversation-Id
      litellm_user_role: internal_user
    - header_name: X-App-Name
      litellm_user_role: internal_user

vector_store_registry:
  - vector_store_name: "litellm_pgvector"
    litellm_params:
      vector_store_id: "litellm_pgvector"
      custom_llm_provider: "pg_vector"
      api_base: os.environ/PGVECTOR_BASE_URL         # References the llmpgvector docker service
      api_key: os.environ/PGVECTOR_SERVER_API_KEY    # Must match SERVER_API_KEY in docker-compose

mcp_servers:
  zai_vision_mcp:
    url: "http://zai-vision-mcp:8000/mcp"
  memory_mcp:
    url: "http://memory-mcp:8000/mcp"
  # Standard Input/Output (stdio) Server
  # zai_vision_mcp:
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@z_ai/mcp-server"]
  #   env:
  #     Z_AI_API_KEY: os.environ/ZAI_API_KEY
  #     Z_AI_MODE: "ZAI"

model_list:
  # Recommended app-facing alias: keep the app contract stable while the backend
  # can be swapped between cloud and local providers depending on environment.
  - model_name: text-embedding-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY
      mode: embedding
    model_info:
      input_cost_per_token: 0
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0
      output_cost_per_token: 0

  # Local-only alias for self-hosted or LM Studio style embedding endpoints.
  - model_name: local-text-embedding
    litellm_params:
      model: os.environ/LOCAL_EMBEDDING_MODEL
      api_base: os.environ/LOCAL_EMBEDDING_BASE_URL
      api_key: os.environ/LOCAL_EMBEDDING_API_KEY
      litellm_provider: openai
      mode: embedding
    model_info:
      input_cost_per_token: 0
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0
      output_cost_per_token: 0

  - model_name: lm_studio/*
    litellm_params:
      model: openai/*
      api_base: os.environ/LMSTUDIO_HOST
      api_key: os.environ/LMSTUDIO_API_KEY
      mode: embedding
      mode: completion
    model_info:
      input_cost_per_token: 0
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0
      output_cost_per_token: 0
      supports_function_calling: true
      supports_tool_choice: true
      # health_check_model: qwen2.5-0.5b-instruct

  # Optional local embedding example for HF/OpenAI-compatible local servers.
  # Replace the values below with your own local embedding endpoint if needed.
  # - model_name: local_embedding/*
  #   litellm_params:
  #     model: openai/*
  #     api_base: os.environ/LOCAL_EMBEDDING_BASE_URL
  #     api_key: os.environ/LOCAL_EMBEDDING_API_KEY
  #     mode: embedding
  #   model_info:
  #     input_cost_per_token: 0
  #     cache_creation_input_token_cost: 0
  #     cache_read_input_token_cost: 0
  #     output_cost_per_token: 0
  #     supports_function_calling: false
  #     supports_tool_choice: false

  # Example local Hugging Face embedding model name:
  # sentence-transformers/all-MiniLM-L6-v2
  # or another model exposed by a local OpenAI-compatible embedding server.

