services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: litellm_pgvector_db
    environment:
      POSTGRES_DB: litellm_vector
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm_vector"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgvector:
    container_name: litellm_pgvector
    build:
      context: .
      dockerfile: pgvector-runtime.Dockerfile
    environment:
      DATABASE_URL: ${PGVECTOR_DATABASE_URL:-postgresql://llmproxy:dbpassword9090@pgvector-db:5432/litellm_vector?schema=public}
      SERVER_API_KEY: ${PGVECTOR_SERVER_API_KEY:-changeme}
      HOST: "0.0.0.0"
      PORT: "8000"
      # Keep these names explicit: these are the LiteLLM embedding settings for
      # the optional vector-store service, not the local LM Studio model endpoint.
      LITELLM_EMBEDDING__MODEL: ${LITELLM_EMBEDDING__MODEL:-text-embedding-3-small}
      LITELLM_EMBEDDING__BASE_URL: ${LITELLM_EMBEDDING__BASE_URL:-http://litellm:4000}
      LITELLM_EMBEDDING__API_KEY: ${LITELLM_EMBEDDING__API_KEY:-sk-1234}
      LITELLM_EMBEDDING__DIMENSIONS: ${LITELLM_EMBEDDING__DIMENSIONS:-1536}
      DB_FIELDS__ID_FIELD: ${DB_FIELDS__ID_FIELD:-id}
      DB_FIELDS__CONTENT_FIELD: ${DB_FIELDS__CONTENT_FIELD:-content}
      DB_FIELDS__METADATA_FIELD: ${DB_FIELDS__METADATA_FIELD:-metadata}
      DB_FIELDS__EMBEDDING_FIELD: ${DB_FIELDS__EMBEDDING_FIELD:-embedding}
      DB_FIELDS__VECTOR_STORE_ID_FIELD: ${DB_FIELDS__VECTOR_STORE_ID_FIELD:-vector_store_id}
      DB_FIELDS__CREATED_AT_FIELD: ${DB_FIELDS__CREATED_AT_FIELD:-created_at}
    expose:
      - "8000"
    depends_on:
      pgvector-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgvector_data:
    name: litellm_pgvector_data
